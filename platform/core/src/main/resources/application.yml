# EaglesEye Core — API, tenancy, settings, reports
quarkus:
  application:
    name: eagleseye-core
  # OIDC (T-403). The API authenticates bearer tokens (service); the browser SPA
  # obtains tokens from Keycloak directly (Vite/React login) and calls the API with
  # them. Tenant comes from the signed token's tenant_id claim.
  oidc:
    # auth-server-url must be present in the base profile so the OIDC tenant is
    # enabled at build time; %dev/%prod can override the host. Empty here would
    # disable OIDC entirely (why bearer auth silently no-op'd before).
    auth-server-url: http://localhost:8090/realms/eagleseye
    client-id: eagleseye-console
    application-type: service
    roles:
      source: accesstoken
    devservices:
      enabled: false   # we run our own Keycloak; don't let Dev Services hijack OIDC
  keycloak:
    devservices:
      enabled: false
  http:
    port: 8080
    # T-403 PARKED: OIDC config below is correct and Keycloak is reachable (discovery
    # 200, tokens carry the tenant_id claim), but the OIDC tenant is not activating as
    # an auth mechanism in this dev setup — protected requests get a bare 403 with no
    # Bearer challenge and no OIDC logs. Needs a focused session (suspect a Quinoa +
    # OIDC dev-mode interaction). Until then the API is open in dev and the tenant is
    # selected by the X-Tenant-Id header (TenantFilter), with RLS still fully enforcing
    # isolation at the database. Flip this to `authenticated` once OIDC activates.
    auth:
      permission:
        api:
          paths: /api/*
          policy: permit
  # DEFAULT datasource = RLS-bound app role; "system" = owner role, cross-tenant,
  # for system components (digest, registry bootstrap). Credentials per profile.
  datasource:
    db-kind: postgresql
    system:
      db-kind: postgresql
  flyway:
    migrate-at-start: true
  mailer:
    from: digest@eagleseye.local   # dev: mailer mocks and logs; real SMTP at deploy time
  # the web console (React+Vite) lives in src/main/webui, served by Quinoa;
  # dev mode proxies Vite's hot-reload server, prod builds it into the jar
  quinoa:
    enable-spa-routing: true
    ignored-path-prefixes:
      - /api
      - /q
      - /ws
    dev-server:
      port: 5173

# channels
mp:
  messaging:
    outgoing:
      registry-devices:
        connector: smallrye-kafka
        topic: registry.devices
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer

# dev profile: talks to the local stack (infra/dev/docker-compose.yml)
"%dev":
  kafka:
    bootstrap:
      servers: localhost:9092
  eagleseye:
    digest:
      email:
        to: manotrip78@gmail.com   # dev: mock mailer logs instead of sending
    traccar:
      url: http://localhost:8083
      token: ${EE_TRACCAR_TOKEN:ee-dev-service-token}
  quarkus:
    redis:
      hosts: redis://localhost:6379
    datasource:
      # DEFAULT = the API connection: app role, subject to row-level security (T-401)
      username: ${EE_DB_APP_USER:eagleseye_app}
      password: ${EE_DB_APP_PASSWORD:eagleseye-app-dev}
      jdbc:
        # host port 5433 — native PostgreSQL owns 5432 on this machine
        url: jdbc:postgresql://localhost:5433/${EE_DB_NAME:eagleseye}
      # system = owner role, cross-tenant (digest, registry bootstrap)
      system:
        username: ${EE_DB_USER:eagleseye}
        password: ${EE_DB_PASSWORD:eagleseye-dev}
        jdbc:
          url: jdbc:postgresql://localhost:5433/${EE_DB_NAME:eagleseye}
    # migrations run as owner (create tables, roles, policies)
    flyway:
      username: ${EE_DB_USER:eagleseye}
      password: ${EE_DB_PASSWORD:eagleseye-dev}
      # dev only: self-heal the schema history after a failed migration attempt
      repair-at-start: true
